name: Feature request
description: Suggest an improvement for Omniscope
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Omniscope v0 is a learning / paper-trading POC (no accounts, no real
        brokerage). Please keep ideas aligned with that scope when possible.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or friction does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? UX sketch in words is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you thought about
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Markets / quotes
        - Crypto
        - Portfolio (paper or live)
        - Agents / LLM chat
        - Settings / config
        - Cross-platform / Web
        - Docs / DX
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I understand this is educational software, not a brokerage product
          required: true
