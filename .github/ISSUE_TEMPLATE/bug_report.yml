name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in what you can — especially
        **platform** and steps to reproduce.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did you see the issue?
      multiple: true
      options:
        - Linux
        - Windows
        - Android
        - iOS
        - macOS
        - Web (Chrome / Edge / other)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / commit version
      description: Settings → About version, or `git rev-parse --short HEAD`
      placeholder: e.g. 1.0.0 or abc1234
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps someone else can follow
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error text or toast messages if any
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional `flutter run` output, analyze errors, or screenshots
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This is not a security vulnerability (those go via SECURITY.md)
          required: true
