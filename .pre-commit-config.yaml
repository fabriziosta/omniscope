# Install once:  pre-commit install --hook-type pre-commit --hook-type pre-push
# Run manually:  pre-commit run --all-files
# Push gates:    flutter analyze + flutter test --exclude-tags live_canary (pre-push)

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '(\.md|\.lock)$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: flutter-analyze
        name: flutter analyze
        entry: tool/flutter_checks.sh analyze
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: flutter-test
        name: flutter test
        entry: tool/flutter_checks.sh test
        language: system
        pass_filenames: false
        stages: [pre-push]
