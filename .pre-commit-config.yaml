# Install once:  pre-commit install --hook-type pre-commit --hook-type pre-push
# Run manually:  pre-commit run --all-files
# Push gates:    version verify + analyze + test + linux release (tool/flutter_checks.sh all)

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '(\.md|\.lock)$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: flutter-checks
        name: flutter checks (analyze + test + linux release)
        entry: tool/flutter_checks.sh all
        language: system
        pass_filenames: false
        stages: [pre-push]
