name: omniscope
description: "Learn investing and manage personal finance"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  shadcn_ui: ^0.57.3
  http: ^1.6.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  provider: ^6.1.5+1
  crypto: ^3.0.8
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  # Runtime preserve/remove while main() loads config; assets from make icons.
  flutter_native_splash: ^2.4.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Master art: assets/brand/app_icon.png (+ adaptive foreground).
# Regenerate: make icons → flutter_launcher_icons + flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  adaptive_icon_background: "#CCFBF1"
  remove_alpha_ios: true

# Teal default brand (secondaryLight / secondaryDark). Android / iOS / Web only.
flutter_native_splash:
  color: "#CCFBF1"
  color_dark: "#134E4A"
  image: assets/brand/app_icon.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#CCFBF1"
    color_dark: "#134E4A"
    image: assets/brand/app_icon_foreground.png
    icon_background_color: "#CCFBF1"
    icon_background_color_dark: "#134E4A"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon.png
    - assets/agents/llm_models.json
    # Source of truth for available CrewAI / LangGraph roles (lives under agents/).
    - agents/omniscope_agents/manifest.json
    # Local keys (gitignored). tool/flutter_checks.sh copies .env.example → .env if missing.
    - .env
    - .env.example
